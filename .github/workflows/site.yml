name: Site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  repository_dispatch:
    types: [idea-published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run sixwords build-site --output _site
        env:
          SIXWORDS_SUPABASE_URL: ${{ vars.SIXWORDS_SUPABASE_URL }}
          SIXWORDS_SUPABASE_ANON_KEY: ${{ vars.SIXWORDS_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
